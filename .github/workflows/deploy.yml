name: Deploy Gone Surfing to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend to AWS S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Fetch API Gateway URL from CloudFormation
        id: cf_outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name GoneSurfing-Stack-prod --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayUrl'].OutputValue" --output text 2>/dev/null || echo "")
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            API_URL="${{ secrets.VITE_API_URL || secrets.VITE_AWS_API_GATEWAY_URL || 'https://bkvv9miw03.execute-api.us-east-1.amazonaws.com/prod' }}"
          fi
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Build Production Frontend
        env:
          VITE_STORAGE_MODE: aws
          VITE_AWS_REGION: us-east-1
          VITE_API_URL: ${{ steps.cf_outputs.outputs.api_url }}
          VITE_AWS_API_GATEWAY_URL: ${{ steps.cf_outputs.outputs.api_url }}
          VITE_AWS_CLOUDFRONT_URL: ${{ secrets.VITE_AWS_CLOUDFRONT_URL }}
          VITE_AWS_S3_BUCKET: ${{ secrets.VITE_AWS_S3_MEDIA_BUCKET }}
        run: pnpm run build

      - name: Deploy Static Files to S3 Frontend Bucket
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_FRONTEND_BUCKET }} --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_FRONTEND_BUCKET }}/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront CDN Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

